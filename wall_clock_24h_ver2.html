<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24-hour Wall Clock</title>
<style>
  :root {
    --bg: #f4f4f2;
    --clock: #ffffff;
    --ink: #202226;
    --muted: #9aa0a6;
    --minute: #555b62;
    --second: #d44949;
    --digital: #434a52;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 35%, #ffffff 0 12%, transparent 45%),
      var(--bg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Yu Gothic UI", "Yu Gothic", sans-serif;
  }

  .clock {
    position: relative;
    width: min(88vmin, 760px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--dial-background, var(--clock));
    border: 1px solid #e4e5e6;
    box-shadow:
      0 22px 50px rgba(0,0,0,.10),
      0 3px 10px rgba(0,0,0,.05),
      inset 0 0 0 7px #fafafa;
  }


  .dial-center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 86%;
    height: 86%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #ffffff;
    pointer-events: none;
  }

  .tick {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .tick::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 2.8%;
    width: 1.5px;
    height: 2.6%;
    background: var(--muted);
    border-radius: 999px;
    transform: translateX(-50%);
  }

  .tick.major::before {
    width: 2.6px;
    height: 4.2%;
    top: 2.2%;
    background: var(--minute);
  }

  .hour-number {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2.6em;
    height: 1.4em;
    margin-left: -1.3em;
    margin-top: -.7em;
    display: grid;
    place-items: center;
    color: var(--digital);
    font: 500 clamp(24px, 5.4vmin, 58px)/1 ui-monospace, SFMono-Regular,
          Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    letter-spacing: -.06em;
    user-select: none;
  }

  .hour-number.active {
    color: #111820;
    font-weight: 700;
  }

  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 999px;
    will-change: transform;
  }

  .hour-hand {
    width: 2.10%;
    height: 25.5%;
    margin-left: -1.05%;
    margin-top: -25.5%;
    background: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.18);
  }

  .minute-hand {
    width: 1.32%;
    height: 36.5%;
    margin-left: -0.66%;
    margin-top: -36.5%;
    background: #34383d;
    box-shadow: 0 1px 2px rgba(0,0,0,.14);
  }

  .second-hand {
    width: 0.54%;
    height: 40.5%;
    margin-left: -0.27%;
    margin-top: -40.5%;
    background: var(--second);
  }

  .second-tail {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0.54%;
    height: 9%;
    margin-left: -0.27%;
    background: var(--second);
    transform-origin: 50% 0;
    will-change: transform;
  }

  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border-radius: 50%;
    background: var(--ink);
    border: 4px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.22);
  }

  .brand {
    position: absolute;
    left: 50%;
    top: 61%;
    transform: translateX(-50%);
    color: #b4b8bc;
    font-size: clamp(8px, 1.2vmin, 11px);
    letter-spacing: .18em;
    text-transform: uppercase;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <main class="clock" id="clock" aria-label="24時間表示のアナログ壁掛け時計">
    <div class="dial-center"></div>
    <div class="brand">LOCAL TIME</div>
    <div class="hand hour-hand" id="hourHand"></div>
    <div class="hand minute-hand" id="minuteHand"></div>
    <div class="hand second-hand" id="secondHand"></div>
    <div class="second-tail" id="secondTail"></div>
    <div class="hub"></div>
  </main>

<script>
(() => {
  const clock = document.getElementById("clock");
  const hourHand = document.getElementById("hourHand");
  const minuteHand = document.getElementById("minuteHand");
  const secondHand = document.getElementById("secondHand");
  const secondTail = document.getElementById("secondTail");

  // 外周の60目盛り
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement("div");
    tick.className = "tick" + (i % 5 === 0 ? " major" : "");
    tick.style.transform = `rotate(${i * 6}deg)`;
    clock.insertBefore(tick, clock.firstChild);
  }

  // 短針の先付近に12個の時刻数字を表示する。
  // 午前中は 0〜11、午後は 12〜23 に切り替える。
  const hourLabels = [];
  for (let h = 0; h < 12; h++) {
    const angle = h * 30;
    const label = makeHourLabel(h, angle, 37);
    hourLabels.push(label);
  }

  function makeHourLabel(value, angleDeg, radiusPercent) {
    const el = document.createElement("div");
    el.className = "hour-number";
    el.textContent = String(value);

    const angle = (angleDeg - 90) * Math.PI / 180;
    const x = 50 + Math.cos(angle) * radiusPercent;
    const y = 50 + Math.sin(angle) * radiusPercent;

    el.style.left = `${x}%`;
    el.style.top = `${y}%`;
    clock.insertBefore(el, hourHand);
    return el;
  }

  function updateHourLabels(hour24) {
    const afternoon = hour24 >= 12;

    for (let i = 0; i < 12; i++) {
      const displayedHour = afternoon ? i + 12 : i;
      hourLabels[i].textContent = String(displayedHour);
      hourLabels[i].classList.toggle("active", displayedHour === hour24);
    }

    // 文字盤の装飾:
    // 午後 (12–23): 12時位置の白から、時計回りに徐々にグレーへ。
    // 午前 (0–11):  0時位置のグレーから、時計回りに徐々に白へ。
    const dialBackground = afternoon
      ? "conic-gradient(from 0deg, #ffffff 0deg, #dddddd 360deg)"
      : "conic-gradient(from 0deg, #dddddd 0deg, #ffffff 360deg)";

    clock.style.setProperty("--dial-background", dialBackground);
  }

  let lastHour = -1;

  function draw() {
    const now = new Date();

    const ms = now.getMilliseconds();
    const seconds = now.getSeconds() + ms / 1000;
    const minutes = now.getMinutes() + seconds / 60;
    const hours12 = (now.getHours() % 12) + minutes / 60;

    const secDeg = seconds * 6;
    const minDeg = minutes * 6;
    const hourDeg = hours12 * 30;

    hourHand.style.transform = `rotate(${hourDeg}deg)`;
    minuteHand.style.transform = `rotate(${minDeg}deg)`;
    secondHand.style.transform = `rotate(${secDeg}deg)`;
    secondTail.style.transform = `rotate(${secDeg + 180}deg)`;

    const currentHour = now.getHours();
    if (currentHour !== lastHour) {
      updateHourLabels(currentHour);
      lastHour = currentHour;
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
