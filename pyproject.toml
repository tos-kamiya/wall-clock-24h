[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wall-clock-24h"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = []
authors = [
  { name = "Toshihiro Kamiya", email = "kamiya@mbj.nifty.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "PySide6>=6.5",
]

[project.scripts]
wall-clock-24h = "wall_clock_24h.app:main"

[project.urls]
Documentation = "https://github.com/Toshihiro Kamiya/wall-clock-24h#readme"
Issues = "https://github.com/Toshihiro Kamiya/wall-clock-24h/issues"
Source = "https://github.com/Toshihiro Kamiya/wall-clock-24h"

[tool.hatch.version]
path = "src/wall_clock_24h/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/wall_clock_24h tests}"

[tool.coverage.run]
source_pkgs = ["wall_clock_24h", "tests"]
branch = true
parallel = true
omit = [
  "src/wall_clock_24h/__about__.py",
]

[tool.coverage.paths]
wall_clock_24h = ["src/wall_clock_24h", "*/wall-clock-24h/src/wall_clock_24h"]
tests = ["tests", "*/wall-clock-24h/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
