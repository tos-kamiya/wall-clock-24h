<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24-hour Wall Clock</title>
<style>
  :root {
    --bg: #f4f4f2;
    --clock: #ffffff;
    --ink: #202226;
    --muted: #9aa0a6;
    --minute: #555b62;
    --second: #d44949;
    --digital: #434a52;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    position: relative;
    overflow: hidden;
    background: rgba(0, 0, 0, .2);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Yu Gothic UI", "Yu Gothic", sans-serif;
  }

  .clock {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(88vmin, 760px);
    min-width: 280px;
    min-height: 280px;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #f4f4f2;
    border: 1px solid #e4e5e6;
    transform: translate(-50%, -50%);
    user-select: none;
    box-shadow:
      0 22px 50px rgba(0,0,0,.10),
      0 3px 10px rgba(0,0,0,.05),
      inset 0 0 0 7px #fafafa;
  }

  .clock::before {
    content: "";
    position: absolute;
    inset: 1.2%;
    border-radius: 50%;
    background: var(--dial-background, #ffffff);
    pointer-events: none;
  }


  .dial-center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 86%;
    height: 86%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #ffffff;
    pointer-events: none;
    z-index: 1;
  }

  .tick {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  .tick::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 2.8%;
    width: 1.5px;
    height: 2.6%;
    background: var(--muted);
    border-radius: 999px;
    transform: translateX(-50%);
  }

  .tick.major::before {
    width: 2.6px;
    height: 4.2%;
    top: 2.2%;
    background: var(--minute);
  }

  .hour-number {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 2.6em;
    height: 1.4em;
    margin-left: -1.3em;
    margin-top: -.7em;
    display: grid;
    place-items: center;
    color: var(--digital);
    font: 500 clamp(29px, 7.8vmin, 70px)/1 ui-monospace, SFMono-Regular,
          Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    letter-spacing: -.06em;
    user-select: none;
    z-index: 5;
    text-shadow:
      -2px -2px 0 rgba(255,255,255,.7), 0 -2px 0 rgba(255,255,255,.7),
      2px -2px 0 rgba(255,255,255,.7), -2px 0 0 rgba(255,255,255,.7),
      2px 0 0 rgba(255,255,255,.7), -2px 2px 0 rgba(255,255,255,.7),
      0 2px 0 rgba(255,255,255,.7), 2px 2px 0 rgba(255,255,255,.7);
  }

  .hour-number.active {
    color: #111820;
    font-weight: 700;
  }

  .hand {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: 50% 100%;
    border-radius: 999px;
    will-change: transform;
    z-index: 3;
  }

  .hour-hand {
    width: 2.10%;
    height: 26.52%;
    margin-left: -1.05%;
    margin-top: -26.52%;
    background: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.18);
  }

  .minute-hand {
    width: 1.32%;
    height: 37.96%;
    margin-left: -0.66%;
    margin-top: -37.96%;
    background: #5d6b78;
    box-shadow: 0 1px 2px rgba(0,0,0,.14);
  }

  .second-hand {
    width: 0.54%;
    height: 43.38%;
    margin-left: -0.27%;
    margin-top: -43.38%;
    background: var(--second);
  }

  .second-tail {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0.54%;
    height: 9%;
    margin-left: -0.27%;
    background: var(--second);
    transform-origin: 50% 0;
    will-change: transform;
    z-index: 3;
  }

  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    margin: -9px 0 0 -9px;
    border-radius: 50%;
    background: var(--ink);
    border: 4px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.22);
    z-index: 4;
  }

  .date {
    position: absolute;
    left: 50%;
    top: calc(42% - 0.5em);
    transform: translateX(-50%);
    color: var(--digital);
    font: 500 clamp(22px, 4.6vmin, 42px)/1 ui-monospace, SFMono-Regular,
          Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    letter-spacing: .02em;
    white-space: nowrap;
    z-index: 5;
    text-shadow:
      -1px -1px 0 rgba(255,255,255,.7), 0 -1px 0 rgba(255,255,255,.7),
      1px -1px 0 rgba(255,255,255,.7), -1px 0 0 rgba(255,255,255,.7),
      1px 0 0 rgba(255,255,255,.7), -1px 1px 0 rgba(255,255,255,.7),
      0 1px 0 rgba(255,255,255,.7), 1px 1px 0 rgba(255,255,255,.7);
  }

  .brand {
    position: absolute;
    left: 50%;
    top: 61%;
    transform: translateX(-50%);
    color: #b4b8bc;
    font-size: clamp(16px, 2.4vmin, 22px);
    letter-spacing: .18em;
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 5;
    text-shadow: 0 0 3px rgba(255,255,255,.8);
  }

</style>
</head>
<body>
  <main class="clock" id="clock" aria-label="24-hour analog wall clock">
    <div class="dial-center"></div>
    <div class="date" id="dateLabel"></div>
    <div class="brand" id="timezoneLabel">UTC</div>
    <div class="hand hour-hand" id="hourHand"></div>
    <div class="hand minute-hand" id="minuteHand"></div>
    <div class="hand second-hand" id="secondHand"></div>
    <div class="second-tail" id="secondTail"></div>
    <div class="hub"></div>
  </main>

<script>
(() => {
  const clock = document.getElementById("clock");
  const hourHand = document.getElementById("hourHand");
  const minuteHand = document.getElementById("minuteHand");
  const secondHand = document.getElementById("secondHand");
  const secondTail = document.getElementById("secondTail");
  const dateLabel = document.getElementById("dateLabel");
  const timezoneLabel = document.getElementById("timezoneLabel");
  const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  // 外周の60目盛り
  for (let i = 0; i < 60; i++) {
    const tick = document.createElement("div");
    tick.className = "tick" + (i % 5 === 0 ? " major" : "");
    tick.style.transform = `rotate(${i * 6}deg)`;
    clock.insertBefore(tick, clock.firstChild);
  }

  // 短針の先付近に12個の時刻数字を表示する。
  // 午前中は 0〜11、午後は 12〜23 に切り替える。
  const hourLabels = [];
  for (let h = 0; h < 12; h++) {
    const angle = h * 30;
    const label = makeHourLabel(h, angle, 37);
    hourLabels.push(label);
  }

  function makeHourLabel(value, angleDeg, radiusPercent) {
    const el = document.createElement("div");
    el.className = "hour-number";
    el.textContent = String(value);

    const angle = (angleDeg - 90) * Math.PI / 180;
    const x = 50 + Math.cos(angle) * radiusPercent;
    const y = 50 + Math.sin(angle) * radiusPercent;

    el.style.left = `${x}%`;
    el.style.top = `${y}%`;
    clock.insertBefore(el, hourHand);
    return el;
  }

  function updateHourLabels(hour24) {
    const afternoon = hour24 >= 12;

    for (let i = 0; i < 12; i++) {
      const displayedHour = afternoon ? i + 12 : i;
      hourLabels[i].textContent = String(displayedHour);
      hourLabels[i].classList.toggle("active", displayedHour === hour24);
    }

    // Dial decoration: the 12–15 or 0–3 quarter stays flat, and only the
    // 3-to-12 segment carries the gradient.
    const dialBackground = afternoon
      ? "conic-gradient(from 0deg, #ffffff 0deg, #ffffff 90deg, #dddddd 360deg)"
      : "conic-gradient(from 0deg, #dddddd 0deg, #dddddd 90deg, #ffffff 360deg)";

    clock.style.setProperty("--dial-background", dialBackground);
  }

  function formatDate(now) {
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${month}/${day}(${WEEKDAYS[now.getDay()]})`;
  }

  function getSystemTimeZone(now) {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZoneName: "short"
    }).formatToParts(now);
    return parts.find((part) => part.type === "timeZoneName")?.value
      || Intl.DateTimeFormat().resolvedOptions().timeZone
      || "UTC";
  }

  let lastHour = -1;
  let lastDate = "";
  let lastTimeZone = "";

  function draw() {
    const now = new Date();

    const ms = now.getMilliseconds();
    const seconds = now.getSeconds() + ms / 1000;
    const minutes = now.getMinutes() + seconds / 60;
    const hours12 = (now.getHours() % 12) + minutes / 60;

    const secDeg = seconds * 6;
    const minDeg = minutes * 6;
    const hourDeg = hours12 * 30;

    hourHand.style.transform = `rotate(${hourDeg}deg)`;
    minuteHand.style.transform = `rotate(${minDeg}deg)`;
    secondHand.style.transform = `rotate(${secDeg}deg)`;
    secondTail.style.transform = `rotate(${secDeg + 180}deg)`;

    const currentHour = now.getHours();
    if (currentHour !== lastHour) {
      updateHourLabels(currentHour);
      lastHour = currentHour;
    }

    const dateText = formatDate(now);
    if (dateText !== lastDate) {
      dateLabel.textContent = dateText;
      lastDate = dateText;
    }

    const timeZone = getSystemTimeZone(now);
    if (timeZone !== lastTimeZone) {
      timezoneLabel.textContent = timeZone;
      lastTimeZone = timeZone;
    }

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
